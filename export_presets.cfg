[preset.0]

name="Universal Realm Pack (.pck)"
platform="Linux/X11"
runnable=false
dedicated_server=false
custom_features="sandboxed_pck"
export_filter="all_resources"
include_filter="*.gd, *.tscn, *.tres, *.gdshader, *.json, *.dialogue"
exclude_filter="*.dll, *.so, *.dylib, tools/*"
export_path="build/patch_v1.pck"

[preset.1]

name="Linux Headless Authoritative Server"
platform="Linux/X11"
runnable=true
dedicated_server=true
custom_features="dedicated_server"
export_filter="dedicated_server"
export_path="build/playable-server.x86_64"

[preset.2]

name="Web Playable Demo (WASM/WebGL2)"
platform="Web"
runnable=true
dedicated_server=false
custom_features="web_demo"
export_filter="all_resources"
export_path="build/web/index.html"
