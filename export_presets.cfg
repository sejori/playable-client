[preset.0]

name="Universal Realm Pack (.pck)"
platform="Linux/X11"
runnable=false
dedicated_server=false
custom_features="sandboxed_pck"
export_filter="all_resources"
include_filter="*.gd, *.tscn, *.tres, *.gdshader, *.json, *.dialogue"
exclude_filter="*.dll, *.so, *.dylib, tools/*"
export_path="build/patch_v1.pck"

[preset.0.options]

[preset.1]

name="Linux Headless Authoritative Server"
platform="Linux/X11"
runnable=true
dedicated_server=true
custom_features="dedicated_server"
export_filter="dedicated_server"
include_filter="*.gd, *.tscn, *.tres, *.gdshader, *.json, *.dialogue"
exclude_filter="tools/*"
export_path="build/playable-server.x86_64"

[preset.1.options]

[preset.2]

name="Web Playable Demo (WASM/WebGL2)"
platform="Web"
runnable=true
dedicated_server=false
custom_features="web_demo"
export_filter="all_resources"
include_filter="*.gd, *.tscn, *.tres, *.gdshader, *.json, *.dialogue"
exclude_filter="*.dll, *.so, *.dylib, tools/*"
export_path="build/web/index.html"

[preset.2.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
